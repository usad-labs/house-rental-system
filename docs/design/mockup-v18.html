<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5A Rentals Mockup v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Kaushan+Script&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0C2C55;
    --teal: #296374;
    --sea: #629FAD;
    --cream: #EDEDCE;
    --paper: #F8F8F0;
    --ink: #0C2C55;
    --ink-2: #3D5170;
    --ink-3: #56667C;
    --line: #DEDFCF;
    --white: #FFFFFF;
    --green: #2E7D57;
    --red: #B42318;
    --amber: #9A5B00;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #D9DCCB; color: var(--ink); font-family: var(--body); }
  .deck { max-width: 1440px; margin: 0 auto; padding: 32px 24px 64px; }
  .deck-head { display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: end; justify-content: space-between; margin-bottom: 28px; }
  .deck-head h1 { font-family: var(--display); font-weight: 700; font-size: 34px; margin: 0 0 4px; }
  .deck-head p { margin: 0; color: var(--ink-2); max-width: 64ch; line-height: 1.5; }
  .tokens { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 92px; font-size: 12px; color: var(--ink-2); }
  .swatch span { display: block; height: 40px; border-radius: 6px; border: 1px solid rgba(12,44,85,.15); margin-bottom: 6px; }
  .frames { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; }
  .frame-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 0; }
  .frame-wrap figcaption { font-weight: 600; color: var(--ink-2); }
  .phone { width: 390px; height: 820px; border: 10px solid var(--navy); border-radius: 44px; overflow: hidden; background: var(--paper); position: relative; box-shadow: 0 30px 60px -30px rgba(12,44,85,.55); }
  .screen { height: 100%; overflow-y: auto; scrollbar-width: none; position: relative; }
  .screen::-webkit-scrollbar { display: none; }

  .brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--navy); text-decoration: none; }
  .plaque { display: inline-grid; place-items: center; height: 30px; min-width: 40px; padding: 0 7px; border-radius: 6px; background: var(--navy); color: var(--cream); font: 700 20px/1 var(--display); box-shadow: inset 0 0 0 2px var(--navy), inset 0 0 0 3.5px rgba(237,237,206,.8); }
  .plaque--light { background: var(--cream); color: var(--navy); box-shadow: inset 0 0 0 2px var(--cream), inset 0 0 0 3.5px var(--navy); }

  .site-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--white); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: var(--teal); color: #fff; border: 0; }

  .hero { position: relative; min-height: 520px; display: flex; align-items: flex-end; color: #fff; background: var(--navy) url("https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/1439Palumlum%2C_Alfonso%2C_Cavite_20.jpg/960px-1439Palumlum%2C_Alfonso%2C_Cavite_20.jpg") center/cover; }
  .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,44,85,.15) 0%, rgba(12,44,85,.55) 45%, rgba(12,44,85,.94) 100%); }
  .hero-copy { position: relative; padding: 24px 16px 22px; }
  .location-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--cream); color: var(--navy); font-weight: 600; font-size: 14px; padding: 6px 10px; border-radius: 999px; margin-bottom: 14px; }
  .hero h1 { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; margin: 0 0 10px; }
  .hero p { font-size: 17px; line-height: 1.5; color: #DCE6EE; margin: 0 0 18px; max-width: 34ch; }
  .btn-row { display: flex; gap: 10px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 10px; font: 600 16px/1 var(--body); text-decoration: none; border: 2px solid transparent; }
  .btn-primary { background: var(--teal); color: #fff; }
  .btn-cream { background: var(--cream); color: var(--navy); }
  .btn-ghost { background: transparent; color: #fff; border-color: rgba(237,237,206,.7); }
  .btn-outline { background: var(--white); color: var(--teal); border-color: var(--sea); }
  .btn-block { flex: 1; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--white); border-bottom: 1px solid var(--line); }
  .stats div { padding: 14px 8px; text-align: center; border-right: 1px solid var(--line); }
  .stats div:last-child { border-right: 0; }
  .stats b { display: block; font: 700 24px/1 var(--display); color: var(--navy); }
  .stats span { font-size: 13px; color: var(--ink-3); }

  .section-title { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.05; margin: 0 0 6px; }
  .section-sub { margin: 0 0 16px; color: var(--ink-2); font-size: 16px; line-height: 1.45; }
  .list { padding: 26px 16px 8px; display: grid; gap: 18px; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit; display: block; }
  .card-photo { position: relative; aspect-ratio: 4 / 3; background: var(--line); }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; left: 12px; top: 12px; font-weight: 600; font-size: 14px; padding: 6px 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .badge--available { background: var(--cream); color: var(--teal); }
  .badge--soon { background: var(--white); color: var(--navy); }
  .badge--occupied { background: rgba(12,44,85,.82); color: #fff; }
  .card-body { padding: 14px 16px 16px; }
  .card h3 { font-size: 20px; font-weight: 600; margin: 0 0 2px; }
  .card .loc { margin: 0 0 12px; color: var(--ink-3); font-size: 15px; }
  .card-foot { display: flex; align-items: end; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 12px; }
  .price { font-family: var(--display); font-weight: 700; font-size: 28px; margin: 0; color: var(--navy); line-height: 1; }
  .price small { font-family: var(--body); font-weight: 500; font-size: 14px; color: var(--ink-3); }
  .util { font-size: 13px; font-weight: 600; color: var(--teal); background: #DCEBEE; padding: 4px 10px; border-radius: 6px; }
  .facts { list-style: none; padding: 0; margin: 0; display: flex; gap: 12px; color: var(--ink-2); font-size: 14px; }
  .is-muted .card-photo img { filter: grayscale(.4); }

  .nearby { padding: 28px 16px; background: var(--navy); color: #fff; margin-top: 18px; }
  .nearby .section-sub { color: #C9D6E2; }
  .places { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; background: rgba(237,237,206,.2); border-radius: 12px; overflow: hidden; }
  .places li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #123663; padding: 14px; }
  .places b { font-weight: 600; font-size: 16px; }
  .places span { font-size: 14px; color: var(--cream); white-space: nowrap; }

  .section { padding: 28px 16px; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: step; }
  .steps li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; font-size: 16px; line-height: 1.45; color: var(--ink-2); }
  .steps li::before { counter-increment: step; content: counter(step); width: 36px; height: 36px; border-radius: 999px; background: var(--cream); color: var(--teal); font: 700 18px/36px var(--display); text-align: center; }
  .steps strong { display: block; color: var(--ink); font-weight: 600; }
  .cta { margin: 0 16px 28px; padding: 22px 18px; background: var(--teal); color: #fff; border-radius: 14px; }
  .cta h3 { font: 700 26px/1.05 var(--display); margin: 0 0 6px; }
  .cta p { margin: 0 0 14px; color: #E1EEF0; }
  .footer { padding: 24px 16px 32px; background: var(--navy); color: #C9D6E2; font-size: 15px; line-height: 1.6; }
  .footer .brand { color: #fff; margin-bottom: 6px; }
  .footer a { color: var(--cream); }

  .back { display: inline-flex; align-items: center; gap: 4px; color: var(--teal); font-weight: 600; text-decoration: none; font-size: 15px; }
  .gallery { position: relative; aspect-ratio: 4 / 3; background: var(--line); }
  .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .counter { position: absolute; right: 12px; bottom: 12px; background: rgba(12,44,85,.8); color: #fff; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; }
  .thumbs { display: flex; gap: 8px; padding: 10px 16px 0; }
  .thumbs img { width: 72px; height: 54px; object-fit: cover; border-radius: 6px; border: 2px solid transparent; }
  .thumbs img.on { border-color: var(--teal); }
  .detail { padding: 18px 16px 8px; }
  .detail h1 { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; margin: 0 0 6px; }
  .detail .loc { color: var(--ink-2); margin: 0 0 16px; font-size: 16px; }
  .price-big { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1; color: var(--navy); }
  .terms { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; line-height: 1.45; }
  .fact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 18px 0; }
  .fact-grid div { background: var(--white); padding: 12px 14px; }
  .fact-grid b { display: block; font: 700 22px/1.1 var(--display); }
  .fact-grid span { color: var(--ink-3); font-size: 14px; }
  .checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .checks li { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; line-height: 1.4; }
  .checks svg { flex: none; margin-top: 2px; }
  .h2 { font: 700 26px var(--display); margin: 22px 0 12px; }
  .prose { font-size: 16px; line-height: 1.6; color: var(--ink-2); margin: 0; }
  .form { display: grid; gap: 12px; background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .field { display: grid; gap: 6px; font-size: 15px; font-weight: 600; }
  .field input, .field select, .field textarea { font: 400 16px var(--body); color: var(--ink); min-height: 46px; padding: 10px 12px; border: 1px solid #C9CCB8; border-radius: 8px; background: var(--white); }
  .field textarea { min-height: 84px; resize: none; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 14px; color: var(--ink-3); margin: 0; font-weight: 400; }
  .sticky-bar { position: sticky; bottom: 0; display: flex; gap: 10px; padding: 12px 16px; background: rgba(255,255,255,.96); border-top: 1px solid var(--line); }

  .dash-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 5; }
  .dash-top .brand { color: #fff; font-size: 20px; }
  .avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--teal); display: grid; place-items: center; font-weight: 600; }
  .dash { padding: 18px 16px 96px; }
  .dash h1 { font-family: var(--display); font-weight: 700; font-size: 32px; margin: 0 0 2px; }
  .dash .sub { color: var(--ink-3); margin: 0 0 18px; }
  .dash h2 { font-size: 17px; font-weight: 600; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  .count { font-size: 13px; font-weight: 600; background: var(--navy); color: #fff; border-radius: 999px; padding: 2px 8px; }
  .alerts { display: grid; gap: 10px; }
  .alert { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 12px 0; overflow: hidden; }
  .alert .bar { align-self: stretch; border-radius: 0 4px 4px 0; }
  .alert.high .bar { background: var(--red); }
  .alert.medium .bar { background: #E0A100; }
  .alert b { display: block; font-size: 16px; font-weight: 600; }
  .alert span { display: block; color: var(--ink-3); font-size: 14px; line-height: 1.35; }
  .alert a { font-size: 14px; font-weight: 600; color: var(--teal); text-decoration: none; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--white); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; }
  .tile img { width: 100%; height: 64px; object-fit: cover; }
  .tile div { padding: 10px 12px 12px; display: grid; gap: 5px; }
  .tile b { font-size: 16px; font-weight: 600; }
  .chip { justify-self: start; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 6px; }
  .chip.occupied { background: #DCEBEE; color: var(--teal); }
  .chip.vacant { background: var(--cream); color: #5B5A1E; }
  .chip.repair { background: #E6EAF0; color: #44546A; }
  .tile .who { font-size: 14px; color: var(--ink-2); }
  .tile .rent { font-size: 13px; font-weight: 600; }
  .rent.ok { color: var(--green); } .rent.late { color: var(--red); } .rent.soon { color: var(--amber); } .rent.none { color: var(--ink-3); font-weight: 500; }
  .tabbar { position: absolute; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--white); border-top: 1px solid var(--line); padding: 8px 4px 14px; z-index: 6; }
  .tab { display: grid; justify-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--ink-3); position: relative; }
  .tab.on { color: var(--teal); }
  .tab .badge2 { position: absolute; top: -4px; right: 18px; background: var(--red); color: #fff; font-size: 11px; border-radius: 999px; padding: 1px 6px; }

  .plate { position: absolute; right: 12px; top: 12px; background: var(--navy); color: var(--cream); font: 700 18px/1 var(--display); padding: 7px 10px; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--navy), inset 0 0 0 3.5px rgba(237,237,206,.8), 0 4px 10px -4px rgba(0,0,0,.5); }
  .compound { padding: 28px 16px 8px; }
  .map { position: relative; background: #E4E6D2; border: 2px solid var(--navy); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: 1fr 34px 1fr; gap: 10px; }
  .map .col { display: grid; gap: 10px; }
  .walk { background: repeating-linear-gradient(180deg, #CFD2BA 0 10px, #D9DBC4 10px 20px); border-radius: 6px; display: grid; place-items: center; }
  .walk span { writing-mode: vertical-rl; transform: rotate(180deg); font: 600 12px var(--body); color: var(--ink-3); letter-spacing: .04em; }
  .lot { display: grid; gap: 2px; padding: 10px; border-radius: 8px; text-decoration: none; min-height: 74px; align-content: start; }
  .lot b { font: 700 20px/1 var(--display); }
  .lot span { font-size: 13px; font-weight: 600; }
  .lot--available { background: var(--cream); color: var(--teal); border: 2px solid var(--teal); }
  .lot--soon { background: #fff; color: var(--navy); border: 2px dashed var(--navy); }
  .lot--occupied { background: var(--navy); color: #C9D6E2; border: 2px solid var(--navy); }
  .lot--big { min-height: 100px; }
  .gate { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 3px solid var(--navy); padding-top: 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .gate i { font-style: normal; background: var(--navy); color: var(--cream); padding: 4px 10px; border-radius: 4px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .legend .l1::before { background: var(--cream); border: 2px solid var(--teal); } .legend .l2::before { background: #fff; border: 2px dashed var(--navy); } .legend .l3::before { background: var(--navy); }
  .boards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .board { position: relative; background: #fff; color: var(--navy); border: 2px solid var(--navy); border-radius: 8px; padding: 14px 12px 10px; box-shadow: 0 3px 0 var(--cream); }
  .board::before, .board::after { content: ""; position: absolute; top: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--sea); }
  .board::before { left: 7px; } .board::after { right: 7px; }
  .board b { display: block; font: 700 22px/1.05 var(--display); }
  .board span { font-size: 13px; color: var(--ink-3); }
  .board--home { grid-column: 1 / -1; background: var(--cream); }

  :root { --sign: "Alfa Slab One", Georgia, serif; --brush: "Kaushan Script", cursive; }
  .phone .screen { background: #F3F1E2; }
  .section-title, .hero h1, .detail h1, .cta h3, .dash h1 { font-family: var(--sign); font-weight: 400; letter-spacing: .01em; }
  .section-title { font-size: 28px; display: inline-block; background: linear-gradient(transparent 70%, rgba(98,159,173,.45) 70% 92%, transparent 92%); padding: 0 2px; }
  .brush { font-family: var(--brush); color: var(--teal); font-size: 20px; display: block; margin: 0 0 2px; transform: rotate(-2deg); transform-origin: left; }
  .forrent { position: relative; margin: -70px 16px 0; z-index: 2; background: var(--cream); border: 4px solid var(--navy); outline: 2px solid var(--cream); outline-offset: -10px; border-radius: 6px; padding: 18px 16px 16px; text-align: center; box-shadow: 0 10px 0 -2px var(--navy), 0 16px 30px -12px rgba(12,44,85,.6); transform: rotate(-1.2deg); }
  .forrent::before, .forrent::after { content: ""; position: absolute; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--sea); box-shadow: inset 0 0 0 2px var(--navy); }
  .forrent::before { left: 10px; } .forrent::after { right: 10px; }
  .forrent .big { display: block; font: 400 54px/0.95 var(--sign); color: var(--navy); text-shadow: 3px 3px 0 var(--sea); letter-spacing: .02em; }
  .forrent .script { display: block; font: 400 26px/1.2 var(--brush); color: var(--teal); margin: 4px 0 8px; }
  .forrent .tel { display: inline-block; font: 700 24px/1 var(--display); color: var(--cream); background: var(--navy); padding: 8px 14px; border-radius: 4px; }
  .forrent small { display: block; margin-top: 8px; font-weight: 600; color: var(--ink-2); }
  .hero { min-height: 430px; }
  .hero h1 { font-size: 36px; text-shadow: 2px 2px 0 rgba(12,44,85,.9); }
  .card { background: var(--cream); border: 3px solid var(--navy); border-radius: 6px; box-shadow: 0 6px 0 -1px var(--navy); position: relative; }
  .card-photo { margin: 10px 10px 0; border: 2px solid var(--navy); border-radius: 3px; overflow: hidden; }
  .card-body { position: relative; }
  .card-body::before, .card-body::after { content: ""; position: absolute; bottom: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--sea); box-shadow: inset 0 0 0 2px var(--navy); }
  .card-body::before { left: 8px; } .card-body::after { right: 8px; }
  .card h3 { font: 400 24px/1.05 var(--sign); color: var(--navy); }
  .card .loc { font-family: var(--brush); font-size: 18px; color: var(--teal); }
  .card-foot { border-top: 2px dashed var(--navy); }
  .badge { border: 2px solid var(--navy); border-radius: 4px; font-family: var(--display); font-size: 17px; letter-spacing: .02em; transform: rotate(-3deg); }
  .badge::before { display: none; }
  .badge--available { background: #FFE27A; color: var(--navy); }
  .stats { background: var(--navy); }
  .stats div { border-color: rgba(237,237,206,.2); }
  .stats b { color: var(--cream); } .stats span { color: #C9D6E2; }
  .steps li::before { background: var(--navy); color: var(--cream); border-radius: 4px; font-family: var(--sign); }
  .cta { border: 3px solid var(--navy); box-shadow: 0 6px 0 -1px var(--navy); border-radius: 6px; }
  .tile { border: 2px solid var(--navy); border-radius: 6px; background: var(--cream); }
  .tile b { font-family: var(--sign); font-weight: 400; font-size: 17px; }

  /* v13: de-template */
  .intro { padding: 18px 16px 4px; }
  .intro h1 { font: 400 30px/1.1 var(--sign); margin: 0 0 8px; color: var(--navy); }
  .intro p { margin: 0 0 10px; color: var(--ink-2); font-size: 16px; line-height: 1.55; }
  .forrent { transform: none; margin: 14px 16px 0; box-shadow: none; }
  .forrent .big { text-shadow: none; }
  .section-title { background: none; padding: 0; }
  .brush { display: none; }
  .badge { transform: none; }
  .card { box-shadow: none; border-width: 2px; }
  .list .card { display: grid; grid-template-columns: 112px 1fr; }
  .list .card-photo { margin: 8px; aspect-ratio: 1; }
  .list .card-body { padding: 10px 12px 12px 4px; }
  .list .card h3 { font-size: 20px; }
  .list .card .loc { font-family: var(--body); font-size: 14px; color: var(--ink-3); margin-bottom: 8px; }
  .list .card-foot { border-top: 0; padding-top: 0; flex-wrap: wrap; }
