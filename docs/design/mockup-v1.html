<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rental System Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gate: #1F5C4A;
    --gate-dark: #174536;
    --gate-tint: #E3EEE9;
    --sign: #FFC93C;
    --sign-tint: #FFF3CC;
    --ink: #1D2433;
    --ink-2: #4A5263;
    --ink-3: #6B7383;
    --wall: #F7F7F4;
    --concrete: #E2E4DE;
    --white: #FFFFFF;
    --red: #B42318;
    --red-tint: #FDECEA;
    --amber: #9A5B00;
    --amber-tint: #FFF4DB;
    --messenger: #0866FF;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #D9DDD5; color: var(--ink); font-family: var(--body); }

  /* ---------- Presentation chrome (not part of the product) ---------- */
  .deck { max-width: 1440px; margin: 0 auto; padding: 32px 24px 64px; }
  .deck-head { display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: end; justify-content: space-between; margin-bottom: 28px; }
  .deck-head h1 { font-family: var(--display); font-weight: 700; font-size: 34px; margin: 0 0 4px; }
  .deck-head p { margin: 0; color: var(--ink-2); max-width: 60ch; line-height: 1.5; }
  .tokens { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 92px; font-size: 12px; color: var(--ink-2); }
  .swatch span { display: block; height: 40px; border-radius: 6px; border: 1px solid rgba(29,36,51,.15); margin-bottom: 6px; }
  .frames { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; }
  .frame-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 0; }
  .frame-wrap figcaption { font-weight: 600; color: var(--ink-2); }
  .phone { width: 390px; height: 820px; border: 10px solid #1D2433; border-radius: 44px; overflow: hidden; background: var(--wall); position: relative; box-shadow: 0 30px 60px -30px rgba(29,36,51,.55); }
  .screen { height: 100%; overflow-y: auto; scrollbar-width: none; position: relative; }
  .screen::-webkit-scrollbar { display: none; }

  /* ---------- Product UI ---------- */
  .site-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--white); border-bottom: 1px solid var(--concrete); position: sticky; top: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--ink); text-decoration: none; }
  .brand svg { flex: none; }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: var(--messenger); color: #fff; border: 0; }

  .hero { padding: 28px 16px 20px; }
  .hero h1 { font-family: var(--display); font-weight: 700; font-size: 42px; line-height: 1.02; letter-spacing: -0.01em; margin: 0 0 12px; }
  .hero p { font-size: 17px; line-height: 1.5; color: var(--ink-2); margin: 0 0 16px; max-width: 34ch; }
  .availability { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; margin-bottom: 18px; }
  .dot { width: 10px; height: 10px; border-radius: 999px; background: var(--sign); box-shadow: 0 0 0 3px var(--sign-tint); }
  .btn-row { display: flex; gap: 10px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 10px; font: 600 16px/1 var(--body); text-decoration: none; border: 2px solid transparent; }
  .btn-primary { background: var(--gate); color: #fff; }
  .btn-messenger { background: var(--white); color: var(--messenger); border-color: #CFE0FF; }
  .btn-block { flex: 1; }

  .list { padding: 8px 16px 8px; display: grid; gap: 18px; }
  .card { background: var(--white); border: 1px solid var(--concrete); border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; display: block; }
  .card-photo { position: relative; aspect-ratio: 4 / 3; background: var(--concrete); }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-body { padding: 14px 16px 16px; }
  .card h3 { font-size: 20px; font-weight: 600; margin: 0 0 2px; }
  .card .loc { margin: 0 0 10px; color: var(--ink-3); font-size: 15px; }
  .price { font-family: var(--display); font-weight: 700; font-size: 28px; margin: 0; }
  .price small { font-family: var(--body); font-weight: 500; font-size: 15px; color: var(--ink-3); }
  .facts { list-style: none; padding: 0; margin: 10px 0 0; display: flex; gap: 16px; color: var(--ink-2); font-size: 15px; }
  .facts li { display: flex; align-items: center; gap: 6px; }
  .is-muted .card-photo img { filter: saturate(.55) brightness(.97); }

  /* The sign: the one bold element */
  .sign { position: absolute; top: 0; right: 18px; display: flex; flex-direction: column; align-items: center; transform-origin: 50% 0; transform: rotate(-3deg); }
  .sign-string { display: block; margin-bottom: -2px; }
  .sign-plate { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1; padding: 8px 14px 9px; border-radius: 4px; border: 2px solid var(--ink); box-shadow: 0 8px 14px -8px rgba(29,36,51,.6); white-space: nowrap; }
  .sign--available .sign-plate { background: var(--sign); color: var(--ink); }
  .sign--occupied .sign-plate { background: #EEF0EC; color: var(--ink-3); border-color: #9AA1AD; font-size: 18px; }
  .sign--soon .sign-plate { background: var(--white); color: var(--gate); border-color: var(--gate); }
  @media (prefers-reduced-motion: no-preference) {
    .sign { animation: swing 1.6s cubic-bezier(.3,.6,.4,1) .4s both; }
    @keyframes swing { 0% { transform: rotate(9deg); } 30% { transform: rotate(-7deg); } 55% { transform: rotate(3deg); } 78% { transform: rotate(-4deg); } 100% { transform: rotate(-3deg); } }
  }

  .section { padding: 28px 16px; }
  .section h2 { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.05; margin: 0 0 14px; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: step; }
  .steps li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; font-size: 16px; line-height: 1.45; color: var(--ink-2); }
  .steps li::before { counter-increment: step; content: counter(step); width: 36px; height: 36px; border-radius: 999px; background: var(--gate-tint); color: var(--gate); font: 700 18px/36px var(--display); text-align: center; }
  .steps strong { display: block; color: var(--ink); font-weight: 600; }

  /* House page */
  .back { display: inline-flex; align-items: center; gap: 4px; color: var(--gate); font-weight: 600; text-decoration: none; font-size: 15px; }
  .gallery { position: relative; aspect-ratio: 4 / 3; background: var(--concrete); }
  .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .counter { position: absolute; right: 12px; bottom: 12px; background: rgba(29,36,51,.75); color: #fff; font-size: 13px; font-weight: 600; padding: 4px 9px; border-radius: 999px; }
  .thumbs { display: flex; gap: 8px; padding: 10px 16px 0; }
  .thumbs img { width: 72px; height: 54px; object-fit: cover; border-radius: 6px; border: 2px solid transparent; }
  .thumbs img.on { border-color: var(--gate); }
  .detail { padding: 18px 16px 8px; }
  .detail h1 { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; margin: 0 0 6px; }
  .detail .loc { color: var(--ink-2); margin: 0 0 16px; font-size: 16px; }
  .price-big { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1; }
  .terms { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; line-height: 1.45; }
  .fact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--concrete); border: 1px solid var(--concrete); border-radius: 12px; overflow: hidden; margin: 18px 0; }
  .fact-grid div { background: var(--white); padding: 12px 14px; }
  .fact-grid b { display: block; font: 700 22px/1.1 var(--display); }
  .fact-grid span { color: var(--ink-3); font-size: 14px; }
  .checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .checks li { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; line-height: 1.4; }
  .checks svg { flex: none; margin-top: 2px; }
  .prose { font-size: 16px; line-height: 1.6; color: var(--ink-2); margin: 0; max-width: 62ch; }
  .form { display: grid; gap: 12px; background: var(--white); border: 1px solid var(--concrete); border-radius: 12px; padding: 16px; }
  .field { display: grid; gap: 6px; font-size: 15px; font-weight: 600; }
  .field input, .field select, .field textarea { font: 400 16px var(--body); color: var(--ink); min-height: 46px; padding: 10px 12px; border: 1px solid #C9CDC4; border-radius: 8px; background: var(--white); }
  .field textarea { min-height: 84px; resize: none; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 14px; color: var(--ink-3); margin: 0; font-weight: 400; }
  .sticky-bar { position: sticky; bottom: 0; display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.96); border-top: 1px solid var(--concrete); backdrop-filter: blur(6px); }

  /* Dashboard */
  .dash-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--gate); color: #fff; position: sticky; top: 0; z-index: 5; }
  .dash-top .brand { color: #fff; font-size: 20px; }
  .avatar { width: 34px; height: 34px; border-radius: 999px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-weight: 600; }
  .dash { padding: 18px 16px 96px; }
  .dash h1 { font-family: var(--display); font-weight: 700; font-size: 32px; margin: 0 0 2px; }
  .dash .sub { color: var(--ink-3); margin: 0 0 18px; }
  .dash h2 { font-size: 17px; font-weight: 600; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  .count { font-size: 13px; font-weight: 600; background: var(--ink); color: #fff; border-radius: 999px; padding: 2px 8px; }
  .alerts { display: grid; gap: 10px; }
  .alert { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; background: var(--white); border: 1px solid var(--concrete); border-radius: 10px; padding: 12px 12px 12px 0; overflow: hidden; }
  .alert .bar { align-self: stretch; border-radius: 0 4px 4px 0; }
  .alert.high .bar { background: var(--red); }
  .alert.medium .bar { background: #E0A100; }
  .alert b { display: block; font-size: 16px; font-weight: 600; }
  .alert span { display: block; color: var(--ink-3); font-size: 14px; line-height: 1.35; }
  .alert a { font-size: 14px; font-weight: 600; color: var(--gate); text-decoration: none; white-space: nowrap; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--white); border: 1px solid var(--concrete); border-radius: 10px; padding: 12px; display: grid; gap: 6px; }
  .tile b { font-size: 16px; font-weight: 600; }
  .chip { justify-self: start; font-size: 13px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
  .chip.occupied { background: var(--gate-tint); color: var(--gate); }
  .chip.vacant { background: var(--sign-tint); color: #7A5600; }
  .chip.repair { background: #E8ECF3; color: #42526E; }
  .tile .who { font-size: 14px; color: var(--ink-2); }
  .tile .rent { font-size: 13px; font-weight: 600; }
  .rent.ok { color: var(--gate); } .rent.late { color: var(--red); } .rent.soon { color: var(--amber); } .rent.none { color: var(--ink-3); font-weight: 500; }
  .inbox-row { display: flex; align-items: center; justify-content: space-between; background: var(--white); border: 1px solid var(--concrete); border-radius: 10px; padding: 14px; }
  .tabbar { position: absolute; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--white); border-top: 1px solid var(--concrete); padding: 8px 4px 14px; z-index: 6; }
  .tab { display: grid; justify-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--ink-3); position: relative; }
  .tab.on { color: var(--gate); }
  .tab .badge { position: absolute; top: -4px; right: 18px; background: var(--red); color: #fff; font-size: 11px; border-radius: 999px; padding: 1px 6px; }
  .footer { padding: 24px 16px 32px; background: var(--ink); color: #D4D8DF; font-size: 15px; line-height: 1.6; }
  .footer b { color: #fff; font-family: var(--display); font-size: 22px; }
  .footer a { color: #fff; }
</style>
</head>
<body>
<main class="deck">
  <header class="deck-head">
    <div>
      <h1>Family rental website + owner dashboard: look and feel</h1>
      <p>Mockup v1 for approval. Each phone screen scrolls. Sample names, prices and illustrations stand in until the real photos and details arrive.</p>
    </div>
    <div class="tokens" aria-label="Color palette">
      <div class="swatch"><span style="background:#1F5C4A"></span>Gate green<br>#1F5C4A</div>
      <div class="swatch"><span style="background:#FFC93C"></span>Sign yellow<br>#FFC93C</div>
      <div class="swatch"><span style="background:#1D2433"></span>Ink<br>#1D2433</div>
      <div class="swatch"><span style="background:#F7F7F4"></span>Wall<br>#F7F7F4</div>
      <div class="swatch"><span style="background:#E2E4DE"></span>Concrete<br>#E2E4DE</div>
    </div>
  </header>

  <div class="frames">
    <!-- 1. Public home -->
    <figure class="frame-wrap">
      <div class="phone"><div class="screen">
        <header class="site-header">
          <a class="brand" href="#"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M3 12 13 3l10 9" fill="none" stroke="#1F5C4A" stroke-width="3" stroke-linejoin="round"/><path d="M6 11v12h14V11" fill="#1F5C4A"/><rect x="11" y="15" width="4" height="8" fill="#FFC93C"/></svg>Tahanan Rentals</a>
          <button class="icon-btn" aria-label="Message us on Messenger"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2C6.4 2 2 6.1 2 11.4c0 2.8 1.2 5.2 3.2 6.9V22l3-1.7c1.2.3 2.4.5 3.8.5 5.6 0 10-4.1 10-9.4S17.6 2 12 2zm1 12.6-2.6-2.7-4.9 2.7 5.4-5.7 2.6 2.7 4.8-2.7-5.3 5.7z"/></svg></button>
        </header>
        <section class="hero">
          <h1>Houses for rent in Sample City</h1>
          <p>Clean, well-kept houses, managed directly by the owners. Message us to book a viewing.</p>
          <div class="availability"><span class="dot"></span>1 house available now, 1 opening soon</div>
          <div class="btn-row"><a class="btn btn-primary btn-block" href="#">See the houses</a><a class="btn btn-messenger" href="#">Message us</a></div>
        </section>
        <div class="list">
          <a class="card" href="#">
            <div class="card-photo"><img src="../../public/sample/kamagong-1.svg" alt="">
              <div class="sign sign--available"><svg class="sign-string" width="44" height="20" viewBox="0 0 44 20"><path d="M22 3 L7 19 M22 3 L37 19" stroke="#3A4150" stroke-width="1.6" fill="none"/><circle cx="22" cy="3" r="2.6" fill="#3A4150"/></svg><div class="sign-plate">Available</div></div>
            </div>
            <div class="card-body"><h3>Kamagong House</h3><p class="loc">Bungalow in Brgy. San Roque</p><p class="price">₱11,000 <small>a month</small></p>
              <ul class="facts"><li>2 bedrooms</li><li>1 bath</li><li>55 m²</li></ul></div>
          </a>
          <a class="card" href="#">
            <div class="card-photo"><img src="../../public/sample/yakal-1.svg" alt="">
              <div class="sign sign--soon"><svg class="sign-string" width="44" height="20" viewBox="0 0 44 20"><path d="M22 3 L7 19 M22 3 L37 19" stroke="#3A4150" stroke-width="1.6" fill="none"/><circle cx="22" cy="3" r="2.6" fill="#3A4150"/></svg><div class="sign-plate">Available soon</div></div>
            </div>
            <div class="card-body"><h3>Yakal House</h3><p class="loc">2-storey house in Brgy. Malinis</p><p class="price">₱20,000 <small>a month</small></p>
              <ul class="facts"><li>4 bedrooms</li><li>3 baths</li><li>140 m²</li></ul></div>
          </a>
          <a class="card is-muted" href="#">
            <div class="card-photo"><img src="../../public/sample/acacia-1.svg" alt="">
              <div class="sign sign--occupied"><svg class="sign-string" width="44" height="20" viewBox="0 0 44 20"><path d="M22 3 L7 19 M22 3 L37 19" stroke="#3A4150" stroke-width="1.6" fill="none"/><circle cx="22" cy="3" r="2.6" fill="#3A4150"/></svg><div class="sign-plate">Occupied</div></div>
            </div>
            <div class="card-body"><h3>Acacia House</h3><p class="loc">2-storey house in Brgy. San Roque</p><p class="price">₱18,000 <small>a month</small></p>
              <ul class="facts"><li>3 bedrooms</li><li>2 baths</li><li>95 m²</li></ul></div>
          </a>
        </div>
        <section class="section">
          <h2>How renting with us works</h2>
          <ol class="steps">
            <li><div><strong>Message us or book a viewing</strong>Tell us which house and when you can visit.</div></li>
            <li><div><strong>See the house in person</strong>One of us shows you around and answers your questions.</div></li>
            <li><div><strong>Sign and move in</strong>Sign the lease, pay the advance and deposit, get your keys.</div></li>
          </ol>
        </section>
        <footer class="footer"><b>Tahanan Rentals</b><br>Houses for rent in Sample City.<br>Call or text 0900 000 0000 · <a href="#">Owner login</a></footer>
      </div></div>
      <figcaption>Website: home</figcaption>
    </figure>

    <!-- 2. Public house page -->
    <figure class="frame-wrap">
      <div class="phone"><div class="screen">
        <header class="site-header">
          <a class="back" href="#"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>All houses</a>
          <a class="brand" href="#" style="font-size:18px">Tahanan Rentals</a>
        </header>
        <div class="gallery"><img src="../../public/sample/kamagong-1.svg" alt=""><span class="counter">1 / 3</span>
          <div class="sign sign--available"><svg class="sign-string" width="44" height="20" viewBox="0 0 44 20"><path d="M22 3 L7 19 M22 3 L37 19" stroke="#3A4150" stroke-width="1.6" fill="none"/><circle cx="22" cy="3" r="2.6" fill="#3A4150"/></svg><div class="sign-plate">Available</div></div>
        </div>
        <div class="thumbs"><img class="on" src="../../public/sample/kamagong-1.svg" alt=""><img src="../../public/sample/kamagong-2.svg" alt=""><img src="../../public/sample/kamagong-3.svg" alt=""></div>
        <div class="detail">
          <h1>Kamagong House</h1>
          <p class="loc">Bungalow in Brgy. San Roque, Sample City</p>
          <div class="price-big">₱11,000 <small style="font:500 17px var(--body);color:var(--ink-3)">a month</small></div>
          <p class="terms">1 month advance + 2 months deposit. Minimum 1-year lease.</p>
          <div class="fact-grid">
            <div><b>2</b><span>bedrooms</span></div><div><b>1</b><span>bathroom</span></div>
            <div><b>55 m²</b><span>floor area</span></div><div><b>90 m²</b><span>lot area</span></div>
          </div>
          <h2 style="font:700 26px var(--display);margin:0 0 12px">What you get</h2>
          <ul class="checks">
            <li><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#E3EEE9"/><path d="M6 10.5l2.6 2.6L14.2 7" fill="none" stroke="#1F5C4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Freshly repainted</li>
            <li><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#E3EEE9"/><path d="M6 10.5l2.6 2.6L14.2 7" fill="none" stroke="#1F5C4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Own water and electric meter</li>
            <li><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#E3EEE9"/><path d="M6 10.5l2.6 2.6L14.2 7" fill="none" stroke="#1F5C4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Front porch</li>
            <li><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#E3EEE9"/><path d="M6 10.5l2.6 2.6L14.2 7" fill="none" stroke="#1F5C4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Small pets allowed</li>
          </ul>
          <h2 style="font:700 26px var(--display);margin:22px 0 10px">About the house</h2>
          <p class="prose">Freshly repainted and ready to move in. A simple, airy bungalow with a front porch, its own meters, and room for a small garden.</p>
          <h2 id="book" style="font:700 26px var(--display);margin:26px 0 12px">Book a viewing</h2>
          <form class="form" onsubmit="return false">
            <label class="field">Your name<input value="Carla Bautista"></label>
            <label class="field">Mobile number<input inputmode="tel" placeholder="09XX XXX XXXX"></label>
            <div class="row-2"><label class="field">Preferred date<input type="date"></label><label class="field">Time of day<select><option>Afternoon</option></select></label></div>
            <label class="field">Message (optional)<textarea placeholder="Questions, number of people, move-in date…"></textarea></label>
            <button class="btn btn-primary">Send viewing request</button>
            <p class="hint">We usually reply within the day.</p>
          </form>
